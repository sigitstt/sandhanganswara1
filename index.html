<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Nulis Jawa</title>
    
    <!-- Memuat Font Noto Sans Javanese dari Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Javanese:wght@400..700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            touch-action: manipulation;
        }

        h1, h2 {
            margin-top: 15px;
            color: #333;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(5, 60px);
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }

        .button {
            width: 60px;
            height: 60px;
            background-color: #FEFDBC;
            border: 2px solid #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-family: 'Noto Sans Javanese', 'nyk Ngayogyan New', sans-serif;
            color: #333;
            cursor: pointer;
            border-radius: 8px;
            transition: transform 0.1s;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .button:active {
            transform: translateY(5px);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .control-button {
            padding: 10px 20px;
            background-color: #055205;
            border: 2px solid #333;
            color: white;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.1s;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .control-button.delete {
            background-color: #A00101;
        }

        .control-button:active {
            transform: translateY(5px);
        }

        .info {
            margin-top: 10px;
            font-size: 18px;
            border: 1px solid white;
            background-color: #333;
            padding: 10px;
            color: white;
        }

        .output {
            margin: 10px 0 5px 0;
            font-size: 20px;
            font-weight: bold;
        }

        .output1 {
            font-size: 24px;
            color: blue;
            font-weight: bold;
        }

        .output2 {            
            margin: 10px 0;
            font-size: 32px;
            color: blue;
            min-height: 50px;
            font-family: 'Noto Sans Javanese', 'nyk Ngayogyan New', sans-serif;
        }
    </style>
</head>
<body>
    <h1>Game Nulis Jawa</h1>
    <h2>(Sandhangan & Pasangan)</h2>

    <div class="info" id="gameInfo">
        <span id="time">Wektu: 30 s</span> | <span id="lives">Nyawa: 3</span> | <span id="score">Skor: 0</span>
    </div>

    <div class="output">Tulisan Latin :</div>
    <div class="output1" id="latinWord">-</div>
    <div class="output">Tulisan Jawa :</div>
    <div class="output2" id="jawaWord"></div>

    <div class="game-board" id="jawaBoard"></div>

    <div class="controls">
        <button class="control-button delete" id="deleteButton">GOSOK</button>
        <button class="control-button confirm" id="confirmButton">KIRIM</button>   
    </div>

    <script>
        // --- WEB AUDIO API (Suara Langsung Tanpa File MP3 & Bebas Delay) ---
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Suara Ketukan Tombol Aksara (Beep Pendek Ringan)
        function playSoundTombol() {
            initAudio();
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime); // Frekuensi 600Hz
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        // Suara Tombol Hapus / Gosok
        function playSoundHapus() {
            initAudio();
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        // Suara Jawaban Benar (Nada Nada Tinggi / Ting!)
        function playSoundBenar() {
            initAudio();
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // Tone C5
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // Tone E5
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        // Suara Jawaban Salah (Nada Rendah / Tet!)
        function playSoundSalah() {
            initAudio();
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.25);
        }

        // Suara Game Over
        function playSoundGameOver() {
            initAudio();
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.6);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.6);
        }

        // Suara Game Finish
        function playSoundFinish() {
            initAudio();
            if (!audioCtx) return;
            const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
            notes.forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + (index * 0.1));
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime + (index * 0.1));
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + (index * 0.1) + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + (index * 0.1));
                osc.stop(audioCtx.currentTime + (index * 0.1) + 0.2);
            });
        }

        // --- DAFTAR SOAL DAN KUNCI JAWABAN ---
        const latinWords = [
            "NANDUR", "MANGAN SATE", "BAPAK TUKU", "IKI", "IKU", "IDU", "IGA", "IBU", "INGU", "URA", "ULA", 
            "ULI", "UPA", "UJA", "UJI", "UGA", "UGI", "ECA", "EKA", "EWA", "EKO", "ORA", "ORI",
            "EDI", "NIKI", "NITI", "NIRA", "NIKA", "NIBA", "NUHONI", "NURI", "NURU", "NUTU",
            "NUSA", "NEDHA", "NEKA", "NELA", "NERAKA", "CIRI", "CINA", "CELANA", "CETHA", "RAHINA",
            "RADI", "RINA", "RIKA", "RIYAYA", "RUPA", "RENA", "RECA", "REKA", "REGA", "REGI",
            "REGU", "REMA", "REJA", "KADI", "KALI", "KAPI", "KAJI", "KINA", "KIRA", "KUNA"
        ];

        const jawaWords = [
            "ꦤꦤ꧀ꦢꦸꦂ", "ꦩꦔꦤ꧀ꦱꦠꦺ", "ꦧꦥꦏ꧀ꦠꦸꦏꦸ", "ꦲꦶꦏꦶ", "ꦲꦶꦏꦸ", "ꦲꦶꦢꦸ", "ꦲꦶꦒ", "ꦲꦶꦧꦸ", "ꦲꦶꦔꦸ", "ꦲꦸꦫ", "ꦲꦸꦭ", 
            "ꦲꦸꦭꦶ", "ꦲꦸꦥ", "ꦲꦸꦗ", "ꦲꦸꦗꦶ", "ꦲꦸꦒ", "ꦲꦸꦒꦶ", "ꦲꦺꦕ", "ꦲꦺꦏ", "ꦲꦺꦮ", "ꦲꦺꦏꦺꦴ", "ꦲꦺꦴꦫ", "ꦲꦺꦴꦫꦶ",
            "ꦲꦺꦢꦶ", "ꦤꦶꦏꦶ", "ꦤꦶꦠꦶ", "ꦤꦶꦫ", "ꦤꦶꦏ", "ꦤꦶꦧ", "ꦤꦸꦲꦺꦴꦤꦶ", "ꦤꦸꦫꦶ", "ꦤꦸꦫꦸ", "ꦤꦸꦠꦸ",
            "ꦤꦸꦱ", "ꦤꦼꦣ", "ꦤꦺꦏ", "ꦤꦼꦭ", "ꦤꦼꦫꦏ", "ꦕꦶꦫꦶ", "ꦕꦶꦤ", "ꦕꦼꦭꦤ", "ꦕꦼꦛ", "ꦫꦲꦶꦤ",
            "ꦫꦢꦶ", "ꦫꦶꦤ", "ꦫꦶꦏ", "ꦫꦶꦪꦪ", "ꦫꦸꦥ", "ꦉꦤ", "ꦉꦕ", "ꦫꦺꦏ", "ꦉꦒ", "ꦉꦒꦶ",
            "ꦉꦒꦸ", "ꦫꦺꦩ", "ꦉꦗ", "ꦏꦢꦶ", "ꦏꦭꦶ", "ꦏꦥꦶ", "ꦏꦗꦶ", "ꦏꦶꦤ", "ꦏꦶꦫ", "ꦏꦸꦤ"
        ];

        const jawaLetters = [
            "ꦲ", "ꦤ", "ꦕ", "ꦫ", "ꦏ", "ꦢ", "ꦠ", "ꦱ", "ꦮ", "ꦭ", 
            "ꦥ", "ꦣ", "ꦗ", "ꦪ", "ꦚ", "ꦩ", "ꦒ", "ꦧ", "ꦛ", "ꦔ", 
            "ꦶ", "ꦸ", "ꦺ", "ꦺꦴ", "ꦼ", "ꦉ", "ꦊ", "ꦂ", "ꦁ", "ꦃ", 
            "ꦿ", "ꦽ", "ꦾ", "꧇", "꧀"
        ];

        let currentLatin = "";
        let currentJawa = "";
        let timeLeft = 30;
        let score = 0;
        let lives = 3;
        let timer = null;
        let totalQuestions = latinWords.length;

        const latinWordEl = document.getElementById("latinWord");
        const jawaWordEl = document.getElementById("jawaWord");
        const timeEl = document.getElementById("time");
        const scoreEl = document.getElementById("score");
        const livesEl = document.getElementById("lives");
        const jawaBoard = document.getElementById("jawaBoard");

        function chooseNewWord() {
            if (latinWords.length === 0) {
                gameFinish();
                return;
            }
            const index = Math.floor(Math.random() * latinWords.length);
            currentLatin = latinWords.splice(index, 1)[0];
            currentJawa = jawaWords.splice(index, 1)[0];
            
            latinWordEl.textContent = currentLatin;
            jawaWordEl.textContent = "";
        }

        function createJawaBoard() {
            jawaBoard.innerHTML = "";
            jawaLetters.forEach(letter => {
                const button = document.createElement("div");
                button.className = "button";
                button.textContent = letter;
                
                button.addEventListener("click", () => {
                    jawaWordEl.textContent += letter;
                    playSoundTombol(); // Suara instan
                });
                
                jawaBoard.appendChild(button);
            });
        }

        document.getElementById("confirmButton").addEventListener("click", () => {
            const inputUser = jawaWordEl.textContent.trim();
            const kunciJawaban = currentJawa.trim();

            if (inputUser === kunciJawaban) {
                score++;
                playSoundBenar();
                scoreEl.textContent = `Skor: ${((score / totalQuestions) * 100).toFixed(1)}`;
                chooseNewWord();
            } else {
                lives--;
                playSoundSalah();
                livesEl.textContent = `Nyawa: ${lives}`;
                if (lives <= 0) {
                    gameOver();
                }
            }
        });

        document.getElementById("deleteButton").addEventListener("click", () => {
            let text = jawaWordEl.textContent;
            if (text.length > 0) {
                jawaWordEl.textContent = Array.from(text).slice(0, -1).join('');
            }
            playSoundHapus();
        });

        function startGame() {
            chooseNewWord();
            createJawaBoard();
            timer = setInterval(() => {
                timeLeft--;
                timeEl.textContent = `Wektu: ${timeLeft} s`;
                if (timeLeft <= 0 || lives <= 0) {
                    gameOver();
                }
            }, 1000);
        }

        function gameOver() {
            clearInterval(timer);
            const gameElements = document.querySelectorAll("#gameInfo, #jawaBoard, .controls, .output, .output1, .output2");
            gameElements.forEach(el => el.style.display = "none");

            const gameOverMessage = document.createElement("div");
            gameOverMessage.style.position = "fixed";
            gameOverMessage.style.top = "30%";
            gameOverMessage.style.left = "50%";
            gameOverMessage.style.transform = "translate(-50%, -50%)";
            gameOverMessage.style.backgroundColor = "#FFC4C4";
            gameOverMessage.style.padding = "20px";
            gameOverMessage.style.boxShadow = "0 4px 8px rgba(0, 0, 0, 0.2)";
            gameOverMessage.style.textAlign = "center";
            gameOverMessage.innerHTML = `
                <h1>Game Over</h1>
                <h2>Skor Anda: </h2>
                <h1>${((score / totalQuestions) * 100).toFixed(1)}</h1>
                <h3>Sabar nggih ...</h3>
                <h3>kanggo main maneh</h3>
                <h2>Refresh halaman! </h2>
            `;
            playSoundGameOver();
            document.body.appendChild(gameOverMessage);
        }

        function gameFinish() {
            clearInterval(timer);
            const gameElements = document.querySelectorAll("#gameInfo, #jawaBoard, .controls, .output, .output1, .output2");
            gameElements.forEach(el => el.style.display = "none");

            const gameFinishMessage = document.createElement("div");
            gameFinishMessage.style.position = "fixed";
            gameFinishMessage.style.top = "30%";
            gameFinishMessage.style.left = "50%";
            gameFinishMessage.style.transform = "translate(-50%, -50%)";
            gameFinishMessage.style.backgroundColor = "#CCF7F5";
            gameFinishMessage.style.padding = "20px";
            gameFinishMessage.style.boxShadow = "0 4px 8px rgba(0, 0, 0, 0.2)";
            gameFinishMessage.style.textAlign = "center";
            gameFinishMessage.innerHTML = `
                <h1>Game Finish</h1>
                <h2>Skor Anda: </h2>
                <h1>${((score / totalQuestions) * 100).toFixed(1)}</h1>
                <h3>Alhamdulillah ...</h3>
                <h3>kanggo main maneh</h3>
                <h2>Refresh halaman! </h2>
            `;
            playSoundFinish();
            document.body.appendChild(gameFinishMessage);
        }

        window.onload = startGame;
    </script>
</body>
</html>
