<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Nulis Jawa</title>
    
    <!-- Memuat Font Noto Sans Javanese dari Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Javanese:wght@400..700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            touch-action: manipulation;
        }

        h1, h2 {
            margin-top: 15px;
            color: #333;
        }

        /* Tampilan Form Identitas Siswa */
        .start-screen {
            max-width: 350px;
            margin: 40px auto;
            padding: 25px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            border: 2px solid #333;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .btn-start {
            width: 100%;
            padding: 12px;
            background-color: #055205;
            color: white;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.05s ease-out;
            user-select: none;
        }

        .game-container {
            display: none;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(5, 60px);
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }

        .button {
            width: 60px;
            height: 60px;
            background-color: #FEFDBC;
            border: 2px solid #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-family: 'Noto Sans Javanese', 'nyk Ngayogyan New', sans-serif;
            color: #333;
            cursor: pointer;
            border-radius: 8px;
            transition: transform 0.05s ease-out;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .button.pressed, .control-button.pressed, .btn-start.pressed, .button:active, .control-button:active {
            transform: translateY(5px);
            background-color: #e6e5a0;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .control-button {
            padding: 10px 18px;
            background-color: #055205;
            border: 2px solid #333;
            color: white;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.05s ease-out;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .control-button.shift {
            background-color: #0056b3;
        }

        .control-button.delete {
            background-color: #A00101;
        }

        .info {
            margin-top: 10px;
            font-size: 18px;
            border: 1px solid white;
            background-color: #333;
            padding: 10px;
            color: white;
        }

        .output {
            margin: 10px 0 5px 0;
            font-size: 20px;
            font-weight: bold;
        }

        .output1 {
            font-size: 24px;
            color: blue;
            font-weight: bold;
        }

        .output2 {            
            margin: 10px 0;
            font-size: 32px;
            color: blue;
            min-height: 50px;
            font-family: 'Noto Sans Javanese', 'nyk Ngayogyan New', sans-serif;
        }

        .sending-status {
            font-size: 14px;
            color: #555;
            margin-top: 10px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <!-- HALAMAN AWAL (FORM IDENTITAS) -->
    <div class="start-screen" id="startScreen">
        <h1>Game Nulis Jawa</h1>
        <h2>Isi Identitas</h2>
        <form id="studentForm">
            <div class="form-group">
                <label for="studentAbsen">1. Nomor Absen:</label>
                <input type="number" id="studentAbsen" placeholder="Masukkan nomor..." required>
            </div>
            <div class="form-group">
                <label for="studentName">2. Nama Lengkap:</label>
                <input type="text" id="studentName" placeholder="Masukkan nama..." required>
            </div>
            <div class="form-group">
                <label for="studentKelas">3. Kelas:</label>
                <input type="text" id="studentKelas" placeholder="Contoh: 7A / 8B..." required>
            </div>
            <button type="button" class="btn-start" id="startBtn">MULAI MAIN</button>
        </form>
    </div>

    <!-- HALAMAN PERMAINAN -->
    <div class="game-container" id="gameContainer">
        <h1>Game Nulis Jawa</h1>
        <h2>(Sandhangan & Pasangan)</h2>

        <div class="info" id="gameInfo">
            <span id="time">Wektu: 30 s</span> | <span id="lives">Nyawa: 3</span> | <span id="score">Skor: 0</span>
        </div>

        <div class="output">Tulisan Latin :</div>
        <div class="output1" id="latinWord">-</div>
        <div class="output">Tulisan Jawa :</div>
        <div class="output2" id="jawaWord"></div>

        <div class="game-board" id="jawaBoard"></div>

        <div class="controls">
            <button class="control-button shift" id="shiftButton">SHIFT 2</button>
            <button class="control-button delete" id="deleteButton">GOSOK</button>
            <button class="control-button confirm" id="confirmButton">KIRIM</button>   
        </div>
    </div>

    <script>
        // === TEMPELKAN URL APPS SCRIPT ANDA DI SINI ===
        const GOOGLE_SCRIPT_URL = "PASTE_URL_GOOGLE_APPS_SCRIPT_DI_SINI";

        // --- WEB AUDIO API ---
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSoundTombol() {
            initAudio();
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        function playSoundHapus() {
            initAudio();
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.7, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        function playSoundBenar() {
            initAudio();
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); 
            gain.gain.setValueAtTime(0.7, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function playSoundSalah() {
            initAudio();
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.25);
        }

        function playSoundGameOver() {
            initAudio();
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.6);
            gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.6);
        }

        function playSoundFinish() {
            initAudio();
            if (!audioCtx) return;
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + (index * 0.1));
                gain.gain.setValueAtTime(0.7, audioCtx.currentTime + (index * 0.1));
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + (index * 0.1) + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + (index * 0.1));
                osc.stop(audioCtx.currentTime + (index * 0.1) + 0.2);
            });
        }

        function triggerPressAnimation(element) {
            element.classList.add("pressed");
            setTimeout(() => {
                element.classList.remove("pressed");
            }, 100);
        }

        // --- DATA SOAL & IDENTITAS ---
        let namaSiswa = "";
        let absenSiswa = "";
        let kelasSiswa = "";

        const latinWords = [
            "NANDUR", "MANGAN SATE", "BAPAK TUKU"
        ];

        const jawaWords = [
            "ꦤꦤ꧀ꦢꦸꦂ", "ꦩꦔꦤ꧀ꦱꦠꦺ", "ꦧꦥꦏ꧀ꦠꦸꦏꦸ"
        ];

        const jawaLettersPrimary = [
            "ꦲ", "ꦤ", "ꦕ", "ꦫ", "ꦏ", 
            "ꦢ", "ꦠ", "ꦱ", "ꦮ", "ꦭ", 
            "ꦥ", "ꦣ", "ꦗ", "ꦪ", "ꦚ", 
            "ꦩ", "ꦒ", "ꦧ", "ꦛ", "ꦔ", 
            "ꦶ", "ꦸ", "ꦺ", "ꦺꦴ", "ꦼ", 
            "ꦉ", "ꦊ", "ꦂ", "ꦁ", "ꦃ", 
            "ꦿ", "ꦽ", "ꦾ", "꧇", "꧀"
        ];

        const jawaLettersSecondary = [
            "ꦟ", "ꦑ", "ꦠ꦳", "ꦯ", "ꦦ", 
            "ꦙ", "ꦓ", "ꦨ", "ꦯ꦳", "ꦖ", 
            "ꦄ", "ꦆ", "ꦈ", "ꦌ", "ꦎ", 
            "ꦑ꦳", "ꦥ꦳", "ꦥ꦳꦳", "ꦗ꦳", "ꦒ꦳", 
            "꧈", "꧉", "꧊", "꧋", "꧌", 
            "꧍", "ꧏ", "꧐", "꧑", "꧒", 
            "꧓", "꧔", "꧕", "꧖", "꧗"
        ];

        let currentBoardMode = 1; 
        let currentLatin = "";
        let currentJawa = "";
        let timeLeft = 99;
        let score = 0;
        let lives = 3;
        let timer = null;
        let totalQuestions = latinWords.length;

        const startScreen = document.getElementById("startScreen");
        const gameContainer = document.getElementById("gameContainer");
        const startBtn = document.getElementById("startBtn");

        const latinWordEl = document.getElementById("latinWord");
        const jawaWordEl = document.getElementById("jawaWord");
        const timeEl = document.getElementById("time");
        const scoreEl = document.getElementById("score");
        const livesEl = document.getElementById("lives");
        const jawaBoard = document.getElementById("jawaBoard");
        const shiftButton = document.getElementById("shiftButton");

        // PROSES FORM IDENTITAS & MULAI GAME
        startBtn.addEventListener("pointerdown", (e) => {
            triggerPressAnimation(e.target);
            const inputAbsen = document.getElementById("studentAbsen").value.trim();
            const inputName = document.getElementById("studentName").value.trim();
            const inputKelas = document.getElementById("studentKelas").value.trim();

            if (inputAbsen === "" || inputName === "" || inputKelas === "") {
                alert("Nyuwun sewu, isi No Absen, Nama, lan Kelas rumiyin!");
                return;
            }

            absenSiswa = inputAbsen;
            namaSiswa = inputName;
            kelasSiswa = inputKelas;

            startScreen.style.display = "none";
            gameContainer.style.display = "block";
            
            startGame();
        });

        function chooseNewWord() {
            if (latinWords.length === 0) {
                gameFinish();
                return;
            }
            const index = Math.floor(Math.random() * latinWords.length);
            currentLatin = latinWords.splice(index, 1)[0];
            currentJawa = jawaWords.splice(index, 1)[0];
            
            latinWordEl.textContent = currentLatin;
            jawaWordEl.textContent = "";
        }

        function renderBoard() {
            jawaBoard.innerHTML = "";
            const activeLetters = (currentBoardMode === 1) ? jawaLettersPrimary : jawaLettersSecondary;
            
            activeLetters.forEach(letter => {
                const button = document.createElement("div");
                button.className = "button";
                button.textContent = letter;
                
                button.addEventListener("pointerdown", () => {
                    triggerPressAnimation(button);
                    jawaWordEl.textContent += letter;
                    playSoundTombol();
                });
                
                jawaBoard.appendChild(button);
            });
        }

        shiftButton.addEventListener("pointerdown", () => {
            triggerPressAnimation(shiftButton);
            playSoundTombol();
            if (currentBoardMode === 1) {
                currentBoardMode = 2;
                shiftButton.textContent = "SHIFT 1";
            } else {
                currentBoardMode = 1;
                shiftButton.textContent = "SHIFT 2";
            }
            renderBoard();
        });

        document.getElementById("confirmButton").addEventListener("pointerdown", (e) => {
            triggerPressAnimation(e.target);
            const inputUser = jawaWordEl.textContent.trim();
            const kunciJawaban = currentJawa.trim();

            if (inputUser === kunciJawaban) {
                score++;
                playSoundBenar();
                scoreEl.textContent = `Skor: ${((score / totalQuestions) * 100).toFixed(1)}`;
                chooseNewWord();
            } else {
                lives--;
                playSoundSalah();
                livesEl.textContent = `Nyawa: ${lives}`;
                if (lives <= 0) {
                    gameOver();
                }
            }
        });

        document.getElementById("deleteButton").addEventListener("pointerdown", (e) => {
            triggerPressAnimation(e.target);
            let text = jawaWordEl.textContent;
            if (text.length > 0) {
                jawaWordEl.textContent = Array.from(text).slice(0, -1).join('');
            }
            playSoundHapus();
        });

        function startGame() {
            chooseNewWord();
            renderBoard();
            timer = setInterval(() => {
                timeLeft--;
                timeEl.textContent = `Wektu: ${timeLeft} s`;
                if (timeLeft <= 0 || lives <= 0) {
                    gameOver();
                }
            }, 1000);
        }

        // FUNGSI UNTUK MENGIRIM DATA KE GOOGLE SHEETS
function sendDataToGoogleSheet(finalScore, gameStatus, statusElementId) {
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx59r8wfRSnqthH9ekg8cegais_XLLCykHplJVvrX9ElV1Ym5SB35h0HxPGPyjz68UQIA/exec";

    // Format data agar dikirim sebagai Form URL Encoded (Paling Stabil untuk Apps Script)
    const formData = new URLSearchParams();
    formData.append("absen", absenSiswa);
    formData.append("nama", namaSiswa);
    formData.append("kelas", kelasSiswa);
    formData.append("skor", finalScore);
    formData.append("status", gameStatus);

    fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors", // Mencegah pemblokiran CORS & Redirect Error
        headers: {
            "Content-Type": "application/x-www-form-urlencoded"
        },
        body: formData.toString()
    })
    .then(() => {
        document.getElementById(statusElementId).textContent = "✓ Data berhasil dikirim!";
    })
    .catch(error => {
        console.error("Error:", error);
    });
}

        function gameOver() {
            clearInterval(timer);
            gameContainer.style.display = "none";
            const finalScore = ((score / totalQuestions) * 100).toFixed(1);

            const gameOverMessage = document.createElement("div");
            gameOverMessage.style.position = "fixed";
            gameOverMessage.style.top = "50%";
            gameOverMessage.style.left = "50%";
            gameOverMessage.style.transform = "translate(-50%, -50%)";
            gameOverMessage.style.backgroundColor = "#FFC4C4";
            gameOverMessage.style.padding = "25px";
            gameOverMessage.style.boxShadow = "0 4px 10px rgba(0, 0, 0, 0.3)";
            gameOverMessage.style.textAlign = "center";
            gameOverMessage.style.borderRadius = "12px";
            gameOverMessage.style.minWidth = "280px";
            gameOverMessage.innerHTML = `
                <h1 style="margin-top:0;">Game Over</h1>
                <hr>
                <p style="font-size: 18px; margin: 8px 0;"><strong>No. Absen:</strong> ${absenSiswa}</p>
                <p style="font-size: 18px; margin: 8px 0;"><strong>Nama:</strong> ${namaSiswa}</p>
                <p style="font-size: 18px; margin: 8px 0;"><strong>Kelas:</strong> ${kelasSiswa}</p>
                <h2>Skor Anda:</h2>
                <h1 style="font-size: 48px; color: #A00101; margin: 10px 0;">${finalScore}</h1>
                <div class="sending-status" id="sendStatus">Menyimpan nilai ke Google Sheet...</div>
                <p style="margin-top:15px;">Sabar nggih... kanggo main maneh</p>
                <h3>Refresh halaman!</h3>
            `;
            playSoundGameOver();
            document.body.appendChild(gameOverMessage);

            sendDataToGoogleSheet(finalScore, "Game Over", "sendStatus");
        }

        function gameFinish() {
            clearInterval(timer);
            gameContainer.style.display = "none";
            const finalScore = ((score / totalQuestions) * 100).toFixed(1);

            const gameFinishMessage = document.createElement("div");
            gameFinishMessage.style.position = "fixed";
            gameFinishMessage.style.top = "50%";
            gameFinishMessage.style.left = "50%";
            gameFinishMessage.style.transform = "translate(-50%, -50%)";
            gameFinishMessage.style.backgroundColor = "#CCF7F5";
            gameFinishMessage.style.padding = "25px";
            gameFinishMessage.style.boxShadow = "0 4px 10px rgba(0, 0, 0, 0.3)";
            gameFinishMessage.style.textAlign = "center";
            gameFinishMessage.style.borderRadius = "12px";
            gameFinishMessage.style.minWidth = "280px";
            gameFinishMessage.innerHTML = `
                <h1 style="margin-top:0;">Game Finish</h1>
                <hr>
                <p style="font-size: 18px; margin: 8px 0;"><strong>No. Absen:</strong> ${absenSiswa}</p>
                <p style="font-size: 18px; margin: 8px 0;"><strong>Nama:</strong> ${namaSiswa}</p>
                <p style="font-size: 18px; margin: 8px 0;"><strong>Kelas:</strong> ${kelasSiswa}</p>
                <h2>Skor Anda:</h2>
                <h1 style="font-size: 48px; color: #055205; margin: 10px 0;">${finalScore}</h1>
                <div class="sending-status" id="sendStatus">Menyimpan nilai ke Google Sheet...</div>
                <p style="margin-top:15px;">Alhamdulillah... kanggo main maneh</p>
                <h3>Refresh halaman!</h3>
            `;
            playSoundFinish();
            document.body.appendChild(gameFinishMessage);

            sendDataToGoogleSheet(finalScore, "Finish", "sendStatus");
        }
    </script>
</body>
</html>
